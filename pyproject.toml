[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yakt"
version = "0.1.0"
description = "Yet Another KRaft — Kafka Raft metadata consensus implementation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Chandana S M", email = "mulagund.chandana@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "pyzmq==27.1.0",
    "requests==2.34.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "ruff==0.11.11",
    "mypy==1.15.0",
]

[project.urls]
Homepage = "https://github.com/chandanamulagund/YAKt-Yet-Another_KRaft"
Repository = "https://github.com/chandanamulagund/YAKt-Yet-Another_KRaft.git"
Issues = "https://github.com/chandanamulagund/YAKt-Yet-Another_KRaft/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — existing codebase has long lines; fix incrementally
    "E402",  # module level import not at top of file
]
exclude = [".venv", "build", "dist"]

[tool.ruff.lint.isort]
known-first-party = ["raft", "server", "client"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = "zmq.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["raft", "server"]
omit = ["*/tests/*", "*/test_*.py"]
